name: Build and ctest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'src/**'
      - 'leviosam-test.py'
      - 'CMakeLists.txt'
      - 'CMakeLists.txt.in'
      - 'testdata/**'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/**'
      - 'src/**'
      - 'leviosam-test.py'
      - 'CMakeLists.txt'
      - 'CMakeLists.txt.in'
      - 'testdata/**'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  # Critical compatibility tests - always run
  critical_tests:
    strategy:
      matrix:
        version: ['1.12', '1.22.1']  # Oldest and newest supported versions
        os: ['ubuntu-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-htslib
        with:
          version: ${{ matrix.version }}
      - uses: ./.github/actions/build-test
        with:
          build-type: ${{ env.BUILD_TYPE }}
    
  # Extended compatibility tests - run on PRs and main branch
  extended_tests:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        version: ['1.19.1', '1.20', '1.21']  # Representative middle versions
        os: ['ubuntu-22.04']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-htslib
        with:
          version: ${{ matrix.version }}
      - uses: ./.github/actions/build-test
        with:
          build-type: ${{ env.BUILD_TYPE }}
    
  # Full compatibility tests - run only on main branch or manual trigger
  full_tests:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        # Test the oldest supported version (1.12) and four most recent versions
        version: ['1.12', '1.19.1', '1.20', '1.21', '1.22.1']
        os: ['ubuntu-22.04', 'ubuntu-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-htslib
        with:
          version: ${{ matrix.version }}
      - uses: ./.github/actions/build-test
        with:
          build-type: ${{ env.BUILD_TYPE }}
