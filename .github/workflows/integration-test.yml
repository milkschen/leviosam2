name: Integration Test

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'src/**'
      - 'leviosam-test.py'
      - 'CMakeLists.txt'
      - 'CMakeLists.txt.in'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'testdata/**'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/**'
      - 'src/**'
      - 'leviosam-test.py'
      - 'CMakeLists.txt'
      - 'CMakeLists.txt.in'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'testdata/**'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi integration environment
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: latest
          environments: integration
          locked: true

      - name: Build and run integration tests
        run: pixi run --locked -e integration test-integration
