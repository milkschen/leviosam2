name: Optimized Compatibility Testing

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'src/**'
      - 'leviosam-test.py'
      - 'CMakeLists.txt'
      - 'CMakeLists.txt.in'
      - 'testdata/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/**'
      - 'src/**'
      - 'leviosam-test.py'
      - 'CMakeLists.txt'
      - 'CMakeLists.txt.in'
      - 'testdata/**'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: true
        default: 'smart'
        type: choice
        options:
        - smart
        - extended
        - full

env:
  BUILD_TYPE: Release

jobs:
  # Smart matrix testing - tests edge cases and representative versions
  smart_tests:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_level == 'smart' || github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        # Test critical versions: oldest, newest, and one middle version
        # Plus one version that historically had issues (if any)
        version: [1.12, 1.15, 1.18]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-htslib
        with:
          version: ${{ matrix.version }}
          cache-enabled: 'true'
      - uses: ./.github/actions/build-test
        with:
          build-type: ${{ env.BUILD_TYPE }}
          cache-enabled: 'true'

  # Extended testing for PRs
  extended_tests:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_level == 'extended')
    strategy:
      matrix:
        version: [1.13, 1.16, 1.17]
        os: [ubuntu-22.04, ubuntu-20.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-htslib
        with:
          version: ${{ matrix.version }}
          cache-enabled: 'true'
      - uses: ./.github/actions/build-test
        with:
          build-type: ${{ env.BUILD_TYPE }}
          cache-enabled: 'true'

  # Full compatibility matrix - only for releases or manual trigger
  full_tests:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_level == 'full')
    strategy:
      matrix:
        version: [1.12, 1.13, 1.14, 1.15, 1.16, 1.17, 1.18]
        os: [ubuntu-22.04, ubuntu-20.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-htslib
        with:
          version: ${{ matrix.version }}
          cache-enabled: 'true'
      - uses: ./.github/actions/build-test
        with:
          build-type: ${{ env.BUILD_TYPE }}
          cache-enabled: 'true'
